[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlenv"
version = "0.1.0"
description = "LLM agent environment for classic RL on Gymnasium with verifiable rewards"
requires-python = ">=3.10"
dependencies = [
  # Pinned: environment dynamics must not drift between training and verification.
  "gymnasium==1.4.0",
  "numpy>=2.1,<3",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rlenv = "rlenv.cli:main"

[tool.setuptools.packages.find]
include = ["rlenv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: full end-to-end runs (real training + full held-out evaluation); run with `make test-all`"]
